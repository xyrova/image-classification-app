name: CI

on:
    # For manual testing
    workflow_dispatch:
    push:
        branches: [main]
        tags:
        -   'v*.*.*'

# only one workflow run( the latest one) at a time even if multiple events
# trigger the workflow at the same time
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    test:
        name: Unit Testing
        runs-on: ubuntu-22.04
        steps:
        -   name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        
        -   name: Setup Python
            uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
            with:
                python-version: '3.14'
                cache: 'pip'
                cache-dependency-path: 'requirements-lock.txt'
                
        -   name: Install Dependencies
            run:    |
                python -m pip install --upgrade pip
                pip install -r requirements-lock.txt

        -   name: Run Unit Tests
            run:    |
                pytest -q

    build-push:
        name: Build and Push Docker Image to ECR
        needs: test
        runs-on: ubuntu-22.04

        # Trigger build only on tag release not on every push to main
        if: ${{ startsWith(github.ref, 'refs/tags/') }}

        permissions:
            id-token: write
            contents: read

        steps:
        -   name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

        -   name: Setup Python
            uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
            with:
                python-version: '3.14'
                cache: 'pip'
                cache-dependency-path: 'requirements-lock.txt'

        -   name: Configure AWS Credentials
            uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
            with:
                role-to-assume: arn:aws:iam::412341941552:role/xyrova-image-app
                aws-region: us-east-1

        -   name: Install dvc and Pull the Models
            run: |
                pip install dvc[s3]
                dvc pull models/model.joblib models/feature_selector.joblib
          
        -   name: Login to Docker Registry (ECR)
            uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 #v4.0.0
            with:
                registry: public.ecr.aws
            env:
                AWS_REGION: us-east-1
        
        -   name: Setup Docker Buildx
            uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

        -   name: Extract Docker Image Metadata
            id: meta
            uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf #v6.0.0
            # Build the Image with full "sha-<commit-id>" tag and git tag
            with:
                images: |
                    public.ecr.aws/y0f7b8d9/xyrova/image-classification-app
                tags: |
                    type=semver,pattern={{version}}
                    type=sha,format=long
                flavor: |
                    latest=false
        
        -   name: Build and Push the Image
            uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 #v7.0.0
            with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
